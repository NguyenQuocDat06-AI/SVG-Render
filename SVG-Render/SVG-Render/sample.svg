  
<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- RECT -->
    <rect x="50" y="50" width="200" height="100" fill="red" fill-opacity="0.4" stroke="black" stroke-width="3" />

    <!-- CIRCLE -->
    <circle cx="400" cy="100" r="60" fill="yellow" stroke="blue" stroke-width="5" />

    <!-- ELLIPSE -->
    <ellipse cx="650" cy="100" rx="80" ry="40" fill="lime" fill-opacity="0.5" />

    <!-- LINE -->
    <line x1="50" y1="200" x2="250" y2="300" stroke="purple" stroke-width="4"/>

    <!-- POLYLINE (không stroke -> SVG default stroke=none, fill=black) -->
    <polyline points="350,200 400,250 450,200 500,250 550,200" fill-opacity="0.5"/>

    <!-- POLYGON -->
    <polygon points="650,180 700,260 600,260" force-fill="cyan" stroke="black" stroke-width="2"/>

    <!-- TEXT -->
    <text x="400" y="400" font-size="36" font-family="Times New Roman" fill="magenta">
        Nguyen Van A
    </text>
</svg>
