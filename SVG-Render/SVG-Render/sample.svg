<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <!-- subtle framed background -->
  <rect x="12" y="12" width="876" height="426" fill-opacity="0.02" stroke="rgb(190,190,190)" stroke-width="3" rx="8" />

  <!-- colorful panel -->
  <rect x="18" y="18" width="864" height="420" fill="rgb(220,120,170)" fill-opacity="0.18" stroke="rgb(20,20,30)" stroke-width="1" rx="6" />

  <!-- title -->
  <text x="28" y="62" fill="rgb(10,40,200)" font-size="44" font-family="Segoe UI, Arial">SVG Demo — Mẫu tương tự</text>

  <!-- transparent hotspot rectangle -->
  <rect x="26" y="80" width="220" height="56" fill-opacity="0" stroke="rgb(200,30,30)" stroke-width="2" rx="6" />

  <!-- author -->
  <text x="560" y="410" fill="rgb(230,10,210)" font-size="30" font-family="Tahoma, Arial">Nguyễn Quoc Đạt</text>

  <!-- layered circle with thick stroke -->
  <circle cx="220" cy="310" r="92" fill="rgb(255,245,90)" fill-opacity="0.6" stroke="rgb(40,40,40)" stroke-width="10" stroke-opacity="0.75" />

  <!-- smooth ellipse -->
  <ellipse cx="560" cy="110" rx="120" ry="58" fill="rgb(0,240,80)" fill-opacity="0.5" stroke="rgb(0,110,40)" stroke-width="4" stroke-opacity="0.7" />

  <!-- diagonal lines with increasing stroke width -->
  <line x1="18" y1="120" x2="80" y2="38" stroke="rgb(0,0,200)" stroke-width="6" stroke-opacity="0.7" />
  <line x1="80" y1="120" x2="140" y2="38" stroke="rgb(0,0,200)" stroke-width="10" stroke-opacity="0.8" />
  <line x1="142" y1="120" x2="204" y2="38" stroke="rgb(0,0,200)" stroke-width="14" stroke-opacity="0.9" />
  <line x1="204" y1="120" x2="266" y2="38" stroke="rgb(0,0,200)" stroke-width="18" stroke-opacity="1.0" />

  <!-- stepped polyline (decorative) -->
  <polyline points="0,46 46,46 46,92 92,92 92,138 138,138 138,156" fill-opacity="0.45" />

  <!-- jagged polyline like in sample -->
  <polyline points="320,30 380,30 380,70 440,70 440,30 500,30 500,70 560,70 560,30 620,30" stroke="rgb(180,20,20)" stroke-width="3" fill="none" stroke-opacity="0.9" />

  <!-- decorative polygon (hexagon) -->
  <polygon points="800,75 880,120 880,210 800,255 720,210 720,120" fill="rgb(150,200,255)" fill-opacity="0.55" stroke="rgb(40,80,120)" stroke-width="2" stroke-opacity="0.7" />

  <!-- star-like polygon -->
  <polygon points="420,160 460,220 540,220 480,270 500,350 420,300 340,350 360,270 300,220 380,220" fill="rgb(255,240,90)" fill-opacity="0.65" stroke="rgb(180,140,30)" stroke-width="2" />

</svg>